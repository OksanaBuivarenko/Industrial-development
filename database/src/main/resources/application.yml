spring:
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost:5438}/fintech_db
    username: ${PG_USER:user}
    password: ${PG_PASSWORD:password}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:/db/changelog/changelog-master.xml

url:
  base_url: https://kudago.com/public-api/v1.4/
  events: events/